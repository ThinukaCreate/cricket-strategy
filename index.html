<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D Cricket Field Strategy Animator</title>
  
  <!-- Modern Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=6">

  <!-- Firebase Realtime Cloud Sync CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Dual-Role Security PIN Lock Screen Overlay (Admin: 1996 | Viewer: 0000) -->
  <div class="pin-lock-overlay" id="pinLockOverlay">
    <div class="pin-card">
      <div class="pin-icon">🏏🔒</div>
      <h2>Cricket Strategy Studio</h2>
      <p>Enter 4-digit PIN to access strategy board</p>

      <div class="pin-input-group">
        <input type="password" id="pinInput" maxlength="4" placeholder="••••" autofocus autocomplete="off">
      </div>

      <div class="pin-error-msg" id="pinErrorMsg" style="display:none;">
        ❌ Invalid PIN. Please try again.
      </div>

      <button class="btn-action green" id="pinSubmitBtn" style="margin-top:0.85rem;">
        <span>🔓 Access Studio</span>
      </button>
    </div>
  </div>

  <!-- Top Navigation Header with Sleek Icon-Only Badges -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">🏏</div>
      <div class="brand-title">
        <h1>Cricket Strategy Studio</h1>
        <p>Tactical Field Placement Simulator</p>
      </div>
    </div>
    
    <div class="header-badges">
      <!-- Live Cloud Sync Indicator (Icon Only) -->
      <div class="badge sync-badge" id="syncStatusBadge" title="🟢 Live Cloud Sync Active">
        <span id="syncStatusText">🟢</span>
      </div>

      <!-- Role Indicator Badge (Icon Only) -->
      <div class="badge" id="roleBadge" title="Current Access Role">
        <span id="roleBadgeText">👑</span>
      </div>

      <!-- Switch Role PIN Button (Icon Only) -->
      <button class="btn-switch-role" id="switchRoleBtn" title="🔑 Switch Access Role PIN">
        🔑
      </button>
    </div>
  </header>

  <!-- Master Main App Grid -->
  <main class="app-container">
    
    <!-- Left Sidebar: 2-Tab Navigation (Tactical Options / Roster & Fielders) -->
    <aside class="sidebar-section">
      
      <div class="sidebar-nav-tabs">
        <button class="nav-tab-btn active" id="tabOptionsBtn">
          <span>⚙️ Tactical Options</span>
        </button>
        <button class="nav-tab-btn" id="tabFieldersBtn">
          <span>👥 Fielders Roster</span>
        </button>
      </div>

      <!-- TAB 1: TACTICAL OPTIONS & SCENARIOS -->
      <div class="tab-content active" id="tabOptions">
        
        <!-- Preset Match Scenarios with Copy & New Controls -->
        <div class="section-box">
          <div class="box-title">
            <span>📋 Match Scenarios</span>
            <div style="display:flex; gap:0.35rem;" id="scenarioAdminControls">
              <button class="btn-icon-small btn-sky" id="duplicateScenarioBtn" title="Copy Active Scenario to Next">📋 Copy Next</button>
              <button class="btn-icon-small btn-emerald" id="createScenarioBtn" title="Create Custom Scenario">➕ New</button>
            </div>
          </div>
          <div class="scenario-grid" id="scenarioGrid">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- Full Scenario Create / Edit Form -->
        <div class="section-box" id="customScenarioForm" style="display: none; background: rgba(30, 41, 59, 0.85); border-color: var(--accent-sky);">
          <div class="box-title">
            <span id="formTitleText">✨ Create New Scenario</span>
            <button class="btn-icon-small btn-rose" id="cancelCustomScBtn" style="font-weight:bold;">✖</button>
          </div>
          <input type="hidden" id="editingScenarioKey" value="">

          <div class="form-group">
            <label class="form-label">Scenario Name</label>
            <input type="text" class="form-input" id="scNameInput" placeholder="e.g. Scenario 5 - Death Overs">
          </div>
          <div class="form-group">
            <label class="form-label">Match Phase</label>
            <select class="form-input" id="scPhaseInput">
              <option value="Power Play">Power Play (Max 2 Outside)</option>
              <option value="After Power Play">After Power Play (Max 5 Outside)</option>
              <option value="Death Overs">Death Overs (Max 5 Outside)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Select Bowler</label>
            <select class="form-input" id="scBowlerInput">
              <!-- Populated via JS from Team Roster -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Bowling Direction</label>
            <select class="form-input" id="scDirInput">
              <option value="down">Bowling Down (Top to Bottom)</option>
              <option value="up">Bowling Up (Bottom to Top)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tactical Note</label>
            <input type="text" class="form-input" id="scNoteInput" placeholder="Tactical instructions for team">
          </div>
          
          <div style="display:flex; gap:0.4rem; margin-top:0.4rem;">
            <button class="btn-action green" id="submitCustomScBtn" style="flex:1;">Save Scenario Settings</button>
            <button class="btn-action rose" id="cancelCustomScBtn2" style="width:auto; padding:0 0.8rem;">Cancel</button>
          </div>
        </div>

        <!-- Single Action Control: Save PNG -->
        <div class="section-box" style="margin-top:auto;">
          <button class="btn-action green" id="exportPngBtn" style="padding:0.75rem 1rem; font-size:0.85rem; font-weight:700;">
            <span>📷 Save PNG Image</span>
          </button>
        </div>

      </div>

      <!-- TAB 2: FIELDERS ROSTER & EDITING (Only for Captain Admin) -->
      <div class="tab-content" id="tabFielders">
        
        <div class="section-box" id="addPlayerSection">
          <div class="box-title">
            <span>➕ Add New Fielder</span>
          </div>
          <div style="display:flex; gap:0.4rem;">
            <input type="text" class="form-input" id="newPlayerNameInput" placeholder="Player Name" style="flex:1;">
            <button class="btn-action green" id="addPlayerBtn" style="width:auto; padding:0 0.75rem;">Add</button>
          </div>
        </div>

        <div class="section-box" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
          <div class="box-title">
            <span>📋 Active Field Roster</span>
            <span style="font-size:0.65rem; color:var(--text-muted);" id="fielderCountLabel">9 Fielders</span>
          </div>
          <div style="overflow-y:auto; flex:1; padding-right:0.2rem;" id="editableRosterList">
            <!-- Populated via JS -->
          </div>
        </div>

      </div>

    </aside>

    <!-- Right Stage: Unobscured Ground Canvas with Frozen Compact Stance Switcher -->
    <section class="stage-section">
      <div class="canvas-card" id="canvasCard">
        
        <!-- FROZEN COMPACT BATSMAN STANCE SWITCHER PILL (RHB / LHB) -->
        <div class="frozen-lefty-bar">
          <button class="stance-toggle-btn" id="leftyToggleBtn" title="Tap to switch Righty (RHB) / Lefty (LHB) Batsman Stance">
            <span>🏏</span>
            <strong id="stanceText">RHB</strong>
          </button>
        </div>

        <canvas id="fieldCanvas"></canvas>
      </div>
    </section>

  </main>

  <!-- Application Logic with cache-busting query parameter -->
  <script src="app.js?v=6"></script>
</body>
</html>
